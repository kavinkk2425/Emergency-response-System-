# ============================================
# Live Video Accident Detection Configuration
# ============================================

# Model Configuration
model:
  weights: "runs/detect/train/weights/best.pt"
  confidence_threshold: 0.20
  ignore_face_detections: true
  input_size: 640
  device: "cpu"  # 'cpu' or 'cuda' or '0' for GPU

# Video Input Configuration
video:
  # Options: 0 (webcam), 'video.mp4' (file), 'rtsp://ip:port/stream' (IP camera)
  source: 0
  # Frame skip (process every nth frame for performance)
  frame_skip: 1
  # Resize frames for faster processing (0 = no resize)
  resize_width: 640
  resize_height: 480
  # Maximum FPS to process (0 = unlimited)
  max_fps: 30

# Display Configuration
display:
  # Show live video window
  show_window: true
  # Window name
  window_title: "🚨 Live Accident Detection System 🚨"
  # Draw bounding boxes
  draw_boxes: true
  # Draw FPS counter
  show_fps: true
  # Draw detection stats
  show_stats: true
  # Text color (BGR format)
  text_color: [0, 255, 0]  # Green
  # Alert color (BGR format)
  alert_color: [0, 0, 255]  # Red
  # Box thickness
  box_thickness: 2

# Alert Configuration
alerts:
  # Show visual alerts (red box + text)
  enable_visual: true
  # Print to console
  enable_console: true
  # Sound alert (beep)
  enable_sound: false
  sound_frequency: 1000  # Hz
  sound_duration: 500    # ms
  # Save accident frames
  save_frames: true
  frames_dir: "output/accident_frames"

# Emergency Dispatch Configuration
emergency_dispatch:
  enabled: true
  server_url: "http://127.0.0.1:5001"
  camera_id: "CAM-01 (Highway Junction 4)"
  location_name: "MG Road Intersection, Zone 3"
  latitude: 12.9716
  longitude: 77.5946
  cooldown_seconds: 15

# Recording Configuration
recording:
  # Save output video with detections
  save_video: true
  output_dir: "output/detected_videos"
  # Video codec
  codec: "mp4v"
  # FPS for output video (0 = same as input)
  fps: 30
  # Video quality (0.5 = 50% size)
  quality: 1.0

# Logging Configuration
logging:
  # Enable detailed logging
  enable_logging: true
  log_dir: "output/logs"
  # Log detection results
  log_detections: true
  # Save statistics
  save_stats: true

# Keyboard Controls
controls:
  quit_key: "q"          # Press 'q' to quit
  pause_key: "p"         # Press 'p' to pause
  save_frame_key: "s"    # Press 's' to save frame
  reset_key: "r"         # Press 'r' to reset stats

# Advanced Configuration
advanced:
  # Multi-threading for faster processing
  use_threading: true
  # Detection buffer size (for smoothing)
  detection_buffer: 3
  # Only detect in ROI (Region of Interest) - set to null to disable
  roi:
    enable: false
    x_start: 0
    y_start: 0
    x_end: 1.0  # Proportion (1.0 = full width)
    y_end: 1.0  # Proportion (1.0 = full height)
